<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamaño de Letra</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="shortcut icon" href="img/LogoICO.ico" type="image/x-icon">
    
</head>
<body>

    <div class="sidebar-overlay">
        <div class="sidebar">
            
            <h3 style="margin-bottom: 5px;">Ajusta el tamaño de letra</h3>
            <p style="font-size:13px; opacity:0.9; margin-bottom:20px;">Elige el tamaño que mejor se adapte a ti.</p>

            <div class="preview-box">
                <p style="font-size: 14px; font-weight: bold; color:#666; margin-bottom:5px;">Vista previa</p>
                <p id="texto-vista-previa">Así se verá el texto en la aplicación con el tamaño seleccionado.</p>
            </div>

            <div class="slider-container">
                <p style="color:#333; font-size:14px; font-weight:bold;">Selecciona el tamaño</p>
                <input type="range" id="slider-tamano" class="range-slider" min="1" max="3" value="2" step="1">
                <div class="labels">
                    <span>Pequeño</span>
                    <span>Mediano</span>
                    <span>Grande</span>
                </div>
            </div>

            <button type="button" id="btn-guardar-letra" class="btn-guardar" onclick="guardarTamanoLetra()">Guardar cambios</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="inicio.html" class="nav-item">🏠</a>
        <a href="chat.html" class="nav-item">💬</a>
        <a href="configuracion.html" class="nav-item active">⚙️</a>
    </nav>

    <script src="script.js"></script>
    
</body>
</html>
